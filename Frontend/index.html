    <!--Téma villanásmentesen jelenjen meg: Localstorage-be is elmentjük a témát, de csak azért hogy ne a default villanjon be a felhasználónak. -->
    <meta name="theme-color" content="ALAP TÉMA FŐSZÍNE" />
    <script>
      // Ez a preconnect előtt kell h fusson
      try {
        const theme = localStorage.getItem("theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
